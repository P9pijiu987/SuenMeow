name: suenmeow

x-suenmeow-common: &suenmeow-common
  build: .
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  volumes:
    - ./config:/app/config
    - ./data:/app/data
    - ./logs:/app/logs

services:
  suenmeow-web:
    <<: *suenmeow-common
    container_name: suenmeow-web
    command: ["python", "main.py", "web", "--root", "/app"]
    ports:
      - "${SUENMEOW_WEB_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  suenmeow-worker:
    <<: *suenmeow-common
    container_name: suenmeow-worker
    command: ["python", "main.py", "worker", "--root", "/app"]
