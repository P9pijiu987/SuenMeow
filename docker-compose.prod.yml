services:
  suenmeow-web:
    restart: always
    environment:
      SUENMEOW_ENV: production
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts
      - ./prompts_backup:/app/prompts_backup
      - suenmeow_data:/app/data
      - ./logs:/app/logs

  suenmeow-public-web:
    restart: always
    environment:
      SUENMEOW_ENV: production
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts
      - ./prompts_backup:/app/prompts_backup
      - suenmeow_data:/app/data
      - ./logs:/app/logs

  suenmeow-worker:
    restart: always
    environment:
      SUENMEOW_ENV: production
    volumes:
      - ./config:/app/config:ro
      - ./prompts:/app/prompts
      - ./prompts_backup:/app/prompts_backup
      - suenmeow_data:/app/data
      - ./logs:/app/logs
