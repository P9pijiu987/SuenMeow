[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suenmeow"
version = "0.1.0"
description = "Event-driven forum persona bot for Discourse forums"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.28.0,<0.29.0",
  "uvicorn>=0.34.0,<0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["bot*", "db*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
