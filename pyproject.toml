[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "suenmeow"
version = "2.0.0"
description = "A safe, configurable Discourse companion"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "sqlalchemy==2.1.2",
  "psycopg[binary]==3.3.6", "httpx==0.28.1", "cryptography==50.0.2",
  "argon2-cffi==25.1.0", "pyotp==2.10.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
suenmeow = "suenmeow.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
