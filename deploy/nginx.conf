map $http_cf_connecting_ip $suenmeow_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    server_tokens off;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SuenMeow-Client-IP $suenmeow_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Server;
    }
    location = /api/prompts/workspace/save {
        client_max_body_size 2m;
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-SuenMeow-Client-IP $suenmeow_client_ip;
        proxy_read_timeout 120s;
        proxy_hide_header Server;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
